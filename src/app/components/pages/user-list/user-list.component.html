<div class="container mt-4">
  <div class="row">
    <h2 class="mb-4">User Directory</h2>
    <div class="row p-3 content-row">
      <div class="row mb-3 search-row">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search by name or email" [(ngModel)]="search"
            (input)="filterUsers()" />
        </div>
        <div class="col-md-6 text-end">
          <div class="btn-group">
            <button class="btn btn-outline-primary" (click)="sortBy('name')">
              Sort by Name
            </button>
            <button class="btn btn-outline-secondary" (click)="sortBy('company.name')">
              Sort by Company
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped shadow-sm rounded border border-2">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Company</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of paginatedUsers; let i = index">
              <td>
                <a class="text-decoration-none" [routerLink]="['/user', user.id]" style="cursor: pointer;">{{ user.name
                  }}</a>
              </td>
              <td>{{ user.email }}</td>
              <td>{{ user.phone }}</td>
              <td>{{ user.company.name }}</td>
            </tr>
          </tbody>

          <tbody class="noData-tbody" *ngIf="paginatedUsers.length < 1">
            No Data Found
          </tbody>
        </table>
      </div>

      <nav class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="page === 1">
            <button class="page-link" (click)="page = page - 1">
              Previous
            </button>
          </li>
          <li class="page-item disabled">
            <span class="page-link">Page {{ page }} of {{ totalPages() }}</span>
          </li>
          <li class="page-item" [class.disabled]="page >= totalPages()">
            <button class="page-link" (click)="page = page + 1">Next</button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
