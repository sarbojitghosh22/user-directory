<div class="container mt-5">
  <div class="card shadow p-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
      <a [routerLink]="['/']" class="text-decoration-none text-dark">
        <i class="bi bi-arrow-left-circle-fill fs-4"></i>
      </a>
      <h4 class="card-title mb-0 text-center flex-grow-1">Details</h4>
      <i class="bi bi-arrow-left-circle-fill fs-4 text-white invisible"></i>
    </div>

    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="row align-items-center" *ngIf="user">
      <div class="col-md-3 text-center">
        <img src="assets/images/images.png" class="rounded-circle border shadow-sm" alt="User Image" />
      </div>

      <div class="col-md-9">
        <div class="row mb-3">
          <div class="col-md-6">
            <p><strong>Name:</strong> {{ user.name }} ({{ user.username }})</p>
          </div>
          <div class="col-md-6">
            <p><strong>Email:</strong> {{ user.email }}</p>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <p><strong>Phone:</strong> {{ user.phone }}</p>
          </div>
          <div class="col-md-6">
            <p><strong>Website:</strong> {{ user.website }}</p>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <p><strong>Company:</strong> {{ user.company.name }}</p>
          </div>
          <div class="col-md-6">
            <p>
              <strong>Address:</strong> {{ user.address.street }},
              {{ user.address.city }}
            </p>
          </div>
        </div>
      </div>
    </div>


    <div class="row align-items-center" *ngIf="!user">
      <h3 class="notFoundTxt">User details not found</h3>
    </div>
  </div>
</div>
